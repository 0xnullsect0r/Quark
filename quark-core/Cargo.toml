[package]
name        = "quark-core"
description = "Core model architecture, training engine, and inference for the Quark LLM"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
default = ["backend-cpu"]
backend-cpu  = ["burn/flex"]
backend-cuda = ["burn/cuda", "nvml-wrapper"]
backend-wgpu = ["burn/wgpu"]

[dependencies]
burn          = { workspace = true, features = ["autodiff", "std", "store"] }

safetensors   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
toml          = { workspace = true }
tokenizers    = { workspace = true }
tokio         = { workspace = true }
sysinfo       = { workspace = true }
anyhow        = { workspace = true }
ureq          = { version = "2", features = ["json"] }
thiserror     = { workspace = true }
tracing       = { workspace = true }
memmap2       = { workspace = true }
bytemuck      = { workspace = true }
half          = { workspace = true }
rand          = { workspace = true }
rayon         = { workspace = true }
dirs          = { workspace = true }
nvml-wrapper  = { version = "0.10", optional = true }
pollster      = { version = "0.3",  optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
